name: diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read docs
        run: |
          git clone --quiet https://github.com/julianosig/easi.run ~/easi.run
          cd ~/easi.run
          echo "== README 236-264 =="; sed -n 236,264p README.md
          echo "== ADMIN_HOSTNAMES refs =="; grep -rnI 'ADMIN_HOSTNAMES' . --include='*.yaml' --include='*.yml' --include='*.md' --include='*.rs' --include='*.ts' --include='*.sh' --include='.env*' 2>/dev/null | grep -v 'docs/readme' | head -n 30
          echo "== compose admin block =="; sed -n 18,70p compose.yaml
          echo "== operations doc =="; ls docs; grep -rnIE 'ADMIN_ORIGIN' docs/*.md | head -n 20
