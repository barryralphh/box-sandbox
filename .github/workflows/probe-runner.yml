name: probe-runner
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runner specs
        run: |
          echo "cores: $(nproc)"; free -h; df -h / | tail -1
          docker --version; docker compose version || true
          systemctl --version | head -1 || true
          ps -p 1 -o comm=
          for c in git curl flock iptables ss awk stat df timeout realpath; do command -v $c >/dev/null && echo "ok $c" || echo "MISSING $c"; done
          id; groups
      - name: Fetch easi.run installer (do not run)
        run: |
          curl -fsSLO https://easi.run/install.sh
          wc -l install.sh
          grep -nE '^\s*(--[a-z-]+\)|usage|Usage)' install.sh | head -40 || true
          grep -nE 'systemctl|docker.service|iptables|nsenter' install.sh | head -30 || true
