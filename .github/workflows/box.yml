name: box
on:
  workflow_dispatch:
concurrency:
  group: box
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  box:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Install easi.run
        run: |
          curl -fsSLO https://easi.run/install.sh
          bash install.sh > install.log 2>&1 || { tail -n 40 install.log; exit 1; }
          tail -n 15 install.log
      - name: Restore saved logins
        uses: actions/cache/restore@v4
        with:
          path: vault.tgz
          key: vault-none
          restore-keys: vault-
      - name: Load saved logins into the box
        run: |
          cd ~/easi.run
          VOL=$(docker volume ls -q | grep -E 'admin-state$' | head -n1 || true)
          echo "state volume: ${VOL:-none}"
          if [ -f "$GITHUB_WORKSPACE/vault.tgz" ] && [ -n "$VOL" ]; then
            docker compose stop 2>&1 | tail -n 3
            docker run --rm -v "$VOL":/v -v "$GITHUB_WORKSPACE":/b alpine:3 sh -c 'cd /v && tar xzf /b/vault.tgz'
            echo "saved logins restored"
          else
            echo "no saved logins yet"
          fi
      - name: Open private tunnel
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --no-tls-verify --url https://localhost:9443 > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ] || { echo "no tunnel url"; tail -n 20 cf.log; exit 1; }
          echo "::add-mask::$URL"
          echo "$URL" > /tmp/live_url
      - name: Point the admin at the tunnel address
        run: |
          URL=$(cat /tmp/live_url)
          echo "::add-mask::$URL"
          cd ~/easi.run
          touch .env
          if grep -q '^ADMIN_ORIGIN=' .env; then sed -i "s|^ADMIN_ORIGIN=.*|ADMIN_ORIGIN=$URL|" .env; else echo "ADMIN_ORIGIN=$URL" >> .env; fi
          grep -q '^ADMIN_MAX_SESSIONS=' .env || echo "ADMIN_MAX_SESSIONS=3" >> .env
          docker compose up -d --no-build --pull never 2>&1 | tail -n 5
          for i in $(seq 1 40); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$URL/" || true)
            echo "tunnel http $code"
            [ "$code" = "200" ] && break
            sleep 3
          done
          [ "$code" = "200" ] || { docker compose logs --no-color --tail 20 admin; exit 1; }
          curl -s -H "Title: Box live link" -d "$URL" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          echo "link sent"
      - name: Keep alive
        run: |
          end=$((SECONDS + 19800))
          while [ $SECONDS -lt $end ]; do
            sleep 60
          done
          echo "time to rotate"
      - name: Pack saved logins
        if: always()
        run: |
          cd ~/easi.run || exit 0
          VOL=$(docker volume ls -q | grep -E 'admin-state$' | head -n1 || true)
          [ -n "$VOL" ] || { echo "no state volume"; exit 0; }
          docker volume ls
          docker compose stop 2>&1 | tail -n 3
          docker run --rm -v "$VOL":/v -v "$GITHUB_WORKSPACE":/b alpine:3 sh -c 'tar czf /b/vault.tgz -C /v . && chown '"$(id -u):$(id -g)"' /b/vault.tgz'
          ls -la "$GITHUB_WORKSPACE/vault.tgz"
      - name: Save logins for the next run
        if: always() && hashFiles('vault.tgz') != ''
        uses: actions/cache/save@v4
        with:
          path: vault.tgz
          key: vault-${{ github.run_id }}
