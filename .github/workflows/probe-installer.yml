name: probe-installer
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Installer header and flags
        run: |
          curl -fsSLO https://easi.run/install.sh
          sed -n 1,75p install.sh
          echo "-----FLAGS-----"
          grep -nE -- '--[a-z-]+\)|--yes|--assume|NONINTERACTIVE|\bread -r|\bread -p|EASI_RUN_|--update|--no-' install.sh | head -60
      - name: install.md
        run: |
          curl -fsSL https://easi.run/install.md | head -150
